name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"
      - name: Run tests
        run: pytest -v
